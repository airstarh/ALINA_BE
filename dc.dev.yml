services:
  nginx:
    ports:
      - "50080:80"
      - "50443:443"

  mysql:
    ports:
      - "53306:3306"

  php:
    build:
      context: ./docker/php
      args:
        INSTALL_XDEBUG: "true"
    restart: unless-stopped
    container_name: alina_php
    env_file: _GITOUT/env/.env
    links:
      - mysql
    extra_hosts:
      host.docker.internal: host-gateway
    expose:
      - "9000"
    volumes:
      # Основной php.ini
      - ./server/usr/local/etc/php/php.ini:/usr/local/etc/php/php.ini:ro
      # Логи (должны быть writable)
      - ./server/var/log/php/:/var/log/php/:rw
      # Веб и фреймворк (должны быть writable для Xdebug-логов/кэшей)
      - ./server/var/www/:/var/www/:rw
      - ./server/srv/:/srv/:rw
    working_dir: /srv/alina
    read_only: false
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    depends_on:
      mysql:
        condition: service_healthy

  php-cs-fixer:
    image: ghcr.io/php-cs-fixer/php-cs-fixer:3-php8.2
    container_name: alina_php_cs_fixer
    volumes:
      - ./server/var/www/:/apps/server/var/www/:rw
      - ./server/srv/:/apps/server/srv/:rw
      - ./.php-cs-fixer.dist.php:/apps/.php-cs-fixer.dist.php:ro
    working_dir: /apps
    user: "${UID:-33}:${GID:-33}"
    read_only: true
    tmpfs:
      - /tmp
