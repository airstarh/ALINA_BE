services:
    cam:
        build:
            context: ./Dockerfile.d/php82
            args:
                INSTALL_XDEBUG: "false"
        container_name: alina_cam
        restart: unless-stopped
        mem_limit: 128M
        expose:
            - "8081"
        env_file: _GITOUT/env/.env
        environment:
            - ALINA_MODE=PROD
        volumes:
            - ./server/srv/:/srv/:ro
            - ./server/var/www/:/var/www/:ro
            - ./server_specific/php82/usr/local/etc/php/conf.d/99.php.ini:/usr/local/etc/php/conf.d/99.php.ini:ro
            - ./server/var/log/php/:/var/log/php/:rw
        working_dir: /srv/alina
        read_only: true
        tmpfs:
            - /tmp
        command: php /var/www/zero.home/addon/cam/stuff/php/talk-server.php
        healthcheck:
            test:
                [
                    "CMD",
                    "php",
                    "-r",
                    '$$found = false; foreach (["/proc/net/tcp", "/proc/net/tcp6"] as $$file) { foreach (@file($$file) ?: [] as $$line) { $$fields = preg_split("/\\s+/", trim($$line)); if (($$fields[3] ?? "") === "0A" && str_ends_with($$fields[1] ?? "", ":1F91")) { $$found = true; break 2; } } } exit($$found ? 0 : 1);',
                ]
            timeout: 5s
            retries: 3
            interval: 10s
            start_period: 10s
        networks:
            - alina_network
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        init: true

    go2rtc:
        image: alexxit/go2rtc:1.9.14
        container_name: alina_go2rtc
        restart: unless-stopped
        mem_limit: 256M
        expose:
            - "1984"
        volumes:
            - ./server/etc/go2rtc/go2rtc.yaml:/etc/go2rtc/go2rtc.yaml:ro
        read_only: true
        tmpfs:
            - /tmp
            - /config
        command:
            - sh
            - -c
            - cp /etc/go2rtc/go2rtc.yaml /config/go2rtc.yaml && exec go2rtc -config /config/go2rtc.yaml
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -q -O /dev/null http://127.0.0.1:1984/cam-stream/api/streams || exit 1",
                ]
            timeout: 5s
            retries: 3
            interval: 10s
            start_period: 10s
        networks:
            - alina_network
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
