
x-vol-nginx: &vol-nginx
  # PHP FAST CGI
  - ./server/etc/nginx/fastcgi.conf:/etc/nginx/fastcgi.conf:ro
  # NGINX CONF
  - ./server/etc/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  - ./server/etc/nginx/conf.d:/etc/nginx/conf.d:ro
  # LETSECTYPT, CERTS
  - ./server/etc/letsencrypt:/etc/letsencrypt
  - ./server/srv/sewa:/srv/sewa:ro
  # LOG
  - ./server/var/log:/var/log:rw
  # WEB
  - ./server/var/www:/var/www:rw
  - ./server/var/www/certbot:/var/www/certbot:rw

services:
  nginx:
    restart: unless-stopped
    env_file: .env
    container_name: alina_nginx
    build: ./docker/nginx
    command: nginx -g "daemon off;"
    links:
      - php
    ports:
      - "50080:80"
      - "50443:443"
    volumes: *vol-nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - FOWNER
      - KILL

  php:
    restart: unless-stopped
    env_file: .env
    container_name: alina_php
    build: ./docker/php
    links:
      - mysql
    expose:
      - "9000"
      - "9001"
    volumes:
      # php.ini
      - ./server/usr/local/etc/php/php.ini:/usr/local/etc/php/php.ini:ro
      - ./server/var/log/php:/var/log/php
      ###- ./server/usr/local/etc/php-fpm.d/www.conf:/usr/local/etc/php-fpm.d/www.conf
      # /var/www
      - ./server/var/www:/var/www
      # ALINA framework
      - ./server/srv:/srv:ro
    working_dir: /srv/alina
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    restart: unless-stopped
    env_file: .env
    image: mysql:8.0.27
    container_name: alina_mysql
    command:
      - --innodb-buffer-pool-size=2G
      - --innodb-log-file-size=512M
      - --innodb-flush-log-at-trx-commit=0
      - --sync-binlog=0
      - --innodb-flush-method=O_DIRECT
      - --innodb-io-capacity=2000
      - --max-allowed-packet=1G
      - --skip-log-bin
    ports:
      - "53306:3306"
    expose:
      - "3306"
    volumes:
      - ./database/mysql:/var/lib/mysql
      - ~/dumps:/tmp/dumps
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/mysqld
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
      interval: 10s
      start_period: 30s

  certbot:
    image: certbot/certbot:latest
    container_name: alina_certbot
    depends_on:
      - nginx
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "default.org:host-gateway"
    entrypoint: /usr/local/bin/certbot
    command:
      - certonly
      - --webroot
      - --webroot-path=/var/www/certbot
      - --email=vsevolod.azovsky@gmail.com
      - --agree-tos
      - --no-eff-email
      - --force-renewal
      - --non-interactive
      - --keep-until-expiring
      - -d
      - default.org
    volumes: *vol-nginx
