# Log DNS queries to container logs (useful for troubleshooting)
log-queries

# Don't forward plain names without dots to upstream servers
domain-needed

# Don't forward queries for private networks upstream
bogus-priv

# Define your local domain routing rules
address=/zero.home/192.168.1.86
address=/chat.home/192.168.1.86
address=/default.org/192.168.1.86

# Fallback upstream DNS servers for public internet traffic
server=1.1.1.1
server=8.8.8.8
