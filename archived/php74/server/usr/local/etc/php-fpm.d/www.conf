[www]

user = www-data
group = www-data

; Слушать только внутри контейнера (безопасно и быстрее)
listen = 127.0.0.1:9000

; Менеджер процессов: dynamic — лучший компромисс для такой конфигурации
pm = dynamic

; Важно: под 2 ГБ и типичную PHP 7.4 нагрузку это безопасный потолок.
; Если у тебя очень тяжёлые скрипты (генерация отчётов и т.п.) — лучше держать максимум 5–7.
pm.max_children = 7

; Стартовые воркеры
pm.start_servers = 2

; Минимум и максимум «простаивающих» воркеров
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Лимит запросов на один воркер — помогает против утечек памяти в старых библиотеках
pm.max_requests = 500

; Таймаут на выполнение запроса в FPM (отдельный от max_execution_time в php.ini)
; Это спасёт, если скрипт зависнет или попадёт в бесконечный цикл.
request_terminate_timeout = 60s

; Логирование медленных запросов (полезно при отладке без Xdebug на проде)
slowlog = /var/log/php/www-slow.log
request_slowlog_timeout = 10s
request_slowlog_trace_depth = 20

; Ограничения ресурсов (под твою среду)
rlimit_files = 1024
rlimit_core = 0

; Chdir — если твои скрипты ожидают, что текущий каталог — корень проекта
chdir = /srv/alina

; Перехватывать stdout/stderr воркеров в лог (удобно для отладки в Docker)
catch_workers_output = yes
decorate_workers_output = no

; Очистка окружения (безопасность)
clear_env = no

; Разрешать только .php (защита от выполнения других расширений как PHP)
security.limit_extensions = .php

; Пример переопределения отдельных PHP-настроек именно для этого пула
; (не дублируй то, что уже есть в php.ini — это только для специфичных значений)
php_admin_value[error_log] = /var/log/php/php-fpm-error.log
php_flag[display_errors] = off
