;;; B-CUSTOM
[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000
pm = dynamic
pm.max_children = 7
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
request_terminate_timeout = 14400s
slowlog = /var/log/php/www-slow.log
request_slowlog_timeout = 60s
request_slowlog_trace_depth = 20
rlimit_files = 65536
rlimit_core = 0
chdir = /srv
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
security.limit_extensions = .php
php_admin_value[error_log] = /var/log/php/php82-fpm-error.log
php_admin_value[upload_max_filesize] = 5000M
php_admin_value[post_max_size] = 5120M
php_admin_value[max_file_uploads] = 100
php_admin_value[upload_tmp_dir] = /var/tmp/php-upload
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 14400
php_admin_value[max_input_time] = 14400
