services:

  signaling:
    container_name: alina_signaling
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      PORT: 3000
      NODE_ENV: production
    # Mount only your signaling workspace directory
    volumes:
      - type: bind
        source: ../ALINA_V/010.d
        target: /app
    # Run the production signaling server without internal SSL certificates
    command: sh -c "npm install && node signaling.prod.js"
    expose:
      - "3000"
