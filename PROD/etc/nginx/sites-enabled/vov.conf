server {
	server_name ospl1942.ru www.ospl1942.ru vov;
    listen 80;
    listen [::]:80;
    charset UTF-8;
    ssi on;
	return 301 https://$host:443$request_uri;
}

server {
    server_name ospl1942.ru www.ospl1942.ru vov;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    ssl_certificate /etc/letsencrypt/live/ospl1942.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ospl1942.ru/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    charset UTF-8;
    root /var/www/vov;
    index index.html index.php;

    location / {
        try_files $uri $uri/ /index.php?alinapath=$uri&$args;
    }

	##################################################
	#region PHP
	# pass PHP scripts to FastCGI server
	# https://stackoverflow.com/questions/15423500/nginx-showing-blank-php-pages/31905948#31905948
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php7.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /(\.|\.well-known|bin|dev|etc|lib|proc|run|sbin|sys|usr|var) {
        deny all;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        add_header Access-Control-Allow-Origin "*";
        expires 1M;
        access_log off;
        add_header Cache-Control "public, immutable, max-age=2592000, no-transform" always;
        add_header Vary "Accept";
        gzip_static on;
        try_files $uri /noimage.png;
    }

    location ~* \.(js|css|html|woff2|ttf|eot|otf|map)$ {
        add_header Access-Control-Allow-Origin "*";
        expires 1M;
        access_log off;
        add_header Cache-Control "public, immutable, max-age=2592000" always;
        gzip_static on;
        try_files $uri @notfound;
    }

    location ~* \.(mp3|mp4|wav|flac|avi)$ {
        add_header Accept-Ranges bytes;
        add_header Content-Disposition "inline";
        add_header X-Content-Type-Options nosniff;

        aio threads;
        sendfile on;
        sendfile_max_chunk 512k;
        directio 1m;

        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";

        gzip off;

        limit_rate 1m;
        limit_rate_after 512k;
    }

    location @notfound {
        return 404;
        error_page 404 /notext.txt;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
