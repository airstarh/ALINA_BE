[www]
user = www-data
group = www-data
listen = 9000
listen.allowed_clients = 127.0.0.1
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = no
catch_workers_output = yes
isplay_errors = Off
log_errors = On
error_log = /var/log/php/php-error.log
upload_tmp_dir = /tmp
