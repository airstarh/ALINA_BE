
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    client_max_body_size 5120M;
    client_body_timeout 14400s;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # Diagnose the router/cloud -> nginx -> chat-worker boundary.
    # Log the path, not the query string (which may contain private values).
    log_format chat '$time_iso8601 host=$host remote=$remote_addr '
                    'method=$request_method uri=$uri status=$status '
                    'upgrade="$http_upgrade" connection="$http_connection" '
                    'duration=$request_time upstream=$upstream_addr '
                    'upstream_status=$upstream_status '
                    'connect=$upstream_connect_time headers=$upstream_header_time '
                    'upstream_duration=$upstream_response_time bytes=$bytes_sent';

    log_format alina_timing '$time_iso8601 host=$host remote=$remote_addr '
                            'method=$request_method uri=$uri status=$status '
                            'duration=$request_time bytes=$bytes_sent '
                            'upstream=$upstream_addr upstream_status=$upstream_status '
                            'connect=$upstream_connect_time headers=$upstream_header_time '
                            'upstream_duration=$upstream_response_time';

    access_log /var/log/nginx/alina.timing.log alina_timing;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
