server {
    client_max_body_size 100m;
    client_body_buffer_size 128k;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    
    listen 80;
    server_name zero.home;
    return 307 https://$server_name$request_uri;
}

server {
    client_max_body_size 100m;
    client_body_buffer_size 128k;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zero.home;

    root /var/www/zero.home;
    error_log /var/log/nginx/zero.home.error.log;
    access_log /var/log/nginx/zero.home.access.log;

    # SSL/TLS
    ssl_certificate /srv/sewa/cert002/borg.home.crt;
    ssl_certificate_key /srv/sewa/cert002/borg.home.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:...;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    # Static assets

    # 1. Image files: fallback to noimage.png
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        add_header Access-Control-Allow-Origin "*";
        expires 1M;
        access_log off;
        add_header Cache-Control "public, immutable, max-age=2592000" always;
        gzip_static on;
        try_files $uri /noimage.png;  # Only images use this fallback
    }

    # 2. Text-like assets: return 404 (empty body) if missing
    location ~* \.(js|css|html|woff2|ttf|eot|otf|map)$ {
        add_header Access-Control-Allow-Origin "*";
        expires 1M;
        access_log off;
        add_header Cache-Control "public, immutable, max-age=2592000" always;
        gzip_static on;

        # Return 404 with empty response body if file not found
        try_files $uri @notfound;
    }

    # PHP
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include /etc/nginx/fastcgi.conf;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_intercept_errors on;
    }

    # Fallback
    location / {
        try_files $uri $uri/ /index.php?alinapath=$uri&$args;
    }

    # Named location to handle 404 with custom content
    location @notfound {
        # Set 404 status explicitly
        return 404;

        # Serve custom content (this runs *after* the 404 is set)
        error_page 404 /notext.txt;

        # Optional: override headers for 404 responses
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
