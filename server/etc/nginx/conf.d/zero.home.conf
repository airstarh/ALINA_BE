server {
    listen 80;
    server_name zero.home;
    return 307 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zero.home;
    root /var/www/zero.home;

    # --- ADD THIS LINE ---
    index index.php index.html; 

    error_log /var/log/nginx/zero.home.error.log;
    access_log /var/log/nginx/zero.home.access.log;

    # SSL/TLS (Ensure these paths are correct inside the container)
    ssl_certificate /srv/sewa/cert002/borg.home.crt;
    ssl_certificate_key /srv/sewa/cert002/borg.home.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    # 1. Image files
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        add_header Access-Control-Allow-Origin "*";
        expires 1M;
        access_log off;
        add_header Cache-Control "public, immutable, max-age=2592000" always;
        try_files $uri /noimage.png;
    }

    # 2. Text-like assets
    location ~* \.(js|css|html|woff2|ttf|eot|otf|map)$ {
        add_header Access-Control-Allow-Origin "*";
        expires 1M;
        access_log off;
        add_header Cache-Control "public, immutable, max-age=2592000" always;
        try_files $uri @notfound;
    }

    # 3. PHP Handling
    location ~ \.php$ {
        # Check if file exists, otherwise return 404
        try_files $uri =404;
        
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        
        # Use fastcgi.conf which usually includes SCRIPT_FILENAME
        include /etc/nginx/fastcgi.conf;
        
        # Ensure SCRIPT_FILENAME is set correctly if fastcgi.conf is missing it
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        fastcgi_intercept_errors on;
    }

    # 4. Main Fallback Logic
    location / {
        # 1. Try actual file
        # 2. Try actual directory (which will now look for index.php due to 'index' directive)
        # 3. Fallback to index.php with arguments
        try_files $uri $uri/ /index.php?alinapath=$uri&$args;
    }

    location @notfound {
        return 404;
        error_page 404 /notext.txt;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
