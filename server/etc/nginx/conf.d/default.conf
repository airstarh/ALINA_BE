##################################################
#
# ALINA
# Default Alina Project
#
##################################################
server {
    server_name default.org;
	root /var/www/default.home;
	listen 80;
	index index.php index.htm index.html;

    include conf.d/location.certbot;

	location / {
		try_files $uri $uri/ /index.php?alinapath=$uri&$args;
	}

	location ~ \.php$ {
		try_files $uri =404;
		fastcgi_split_path_info ^(.+\.php)(/.+)$;
		fastcgi_pass php:9000;
		fastcgi_index index.php;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param PATH_INFO $fastcgi_path_info;
	}
}

server {
    server_name default.org;
    root /var/www/default.home;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    ssl_certificate /srv/sewa/cert003/cert/040.byrobot.fullchain.pem;
    ssl_certificate_key /srv/sewa/cert003/cert/030.byrobot.privkey.pem;

    include conf.d/location.alina;
}
